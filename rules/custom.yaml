# A file NAMED like a runtime above is only treated leniently when it is really the vendor's file:
# a valid Authenticode signature whose subject contains one of these names...
# (matched against the certificate's Organisation field: the exact name, optionally followed only by
# corporate suffixes such as Inc., Corp., ApS, LLC)
trusted_runtime_signers:
  - Unity Technologies
  - Valve
  - Microsoft
  - Microsoft Corporation
  - Epic Games
  - CD PROJEKT
  - GOG
  - Discord
  - Firelight Technologies
  - Audiokinetic
  - NVIDIA
  - Advanced Micro Devices
  - Intel
  - Google
  - LunarG
  - GitHub
  - OpenJS
# ...or, for these unsigned Chromium/NW.js companions, sitting next to a detected Electron/NW.js runtime exe.
unsigned_chromium_runtime:
  - ffmpeg.dll
  - libEGL.dll
  - libGLESv2.dll
  - vk_swiftshader.dll
  - vulkan-1.dll
  - nw.dll
  - nw_elf.dll
  - node.dll
  - notification_helper.exe
  - crashpad_handler.exe
  - d3dcompiler_47.dll
# (Glob matches below, Unity's managed framework assemblies, are unsigned by design and trusted by location;
# they are still covered by antivirus, YARA and hash lookups.)

# Path globs (relative, case-insensitive) that also count as engine runtime.
engine_runtime_globs:
  - "*/MonoBleedingEdge/*"
  - "*_Data/Managed/UnityEngine*.dll"
  - "*_Data/Managed/Unity.*.dll"
  - "*_Data/Managed/System*.dll"
  - "*_Data/Managed/Mono.*.dll"
  - "*_Data/Managed/mscorlib.dll"
  - "*_Data/Managed/netstandard.dll"
  - "*_Data/Managed/Microsoft.*.dll"
  - "*_Data/Plugins/*/lib_burst_generated.dll"
  - "*/D3D12/*.dll"
  - "*/api-ms-win-*.dll"

# Helper executables engines ship next to the game. They don't count as "extra executables".
helper_executables:
  - UnityCrashHandler64.exe
  - UnityCrashHandler32.exe
  - crashpad_handler.exe
  - notification_helper.exe
  - dxwebsetup.exe
  - vc_redist.x64.exe
  - vc_redist.x86.exe
  - CrashReportClient.exe
  - UE4PrereqSetup_x64.exe
  - UEPrereqSetup_x64.exe
  - EpicWebHelper.exe
  - python.exe
  - pythonw.exe
  - zsync.exe
  - zsyncmake.exe

# Windows system DLL names that malware ships next to a legitimate exe so it gets loaded instead
# (DLL side-loading). Games don't ship these; a hit is High. Mods/wrappers like dinput8.dll or
# d3d9.dll/dxgi.dll (ReShade, DXVK) are deliberately not listed.
sideload_dll_names:
  - version.dll
  - winhttp.dll
  - wininet.dll
  - dbghelp.dll
  - dbgcore.dll
  - cryptsp.dll
  - cryptbase.dll
  - userenv.dll
  - profapi.dll
  - wtsapi32.dll
  - secur32.dll
  - sspicli.dll
  - msimg32.dll
  - uxtheme.dll
  - dwmapi.dll
  - iphlpapi.dll
  - netapi32.dll
  - winmm.dll
  - mpr.dll
  - propsys.dll
  - wldp.dll
  - amsi.dll
  - credui.dll
  - dpapi.dll
  - samcli.dll
