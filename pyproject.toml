[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jam-triage"
version = "0.1.0"
description = "Malware triage for game jam submissions. Never executes a submission."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "requests>=2.31", "yara-python>=4.5", "pefile>=2023.2.7", "signify>=0.7", "rich>=13", "jinja2>=3.1",
  "openpyxl>=3.1", "fastapi>=0.110", "uvicorn>=0.29", "pyyaml>=6",
]

[project.optional-dependencies]
extract = ["itch-dl>=0.5", "pyinstxtractor-ng>=0.9", "node-sea-scallop"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
triage = "jamtriage.cli:main"

[tool.setuptools]
packages = ["jamtriage", "jamtriage.checks", "jamtriage.lookups", "jamtriage.sandbox"]

[tool.setuptools.package-data]
jamtriage = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
